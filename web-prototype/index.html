<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng niệm online (bản thử)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span> Chánh điện · Phòng 1 <small id="count">0/20</small></div>
  <nav class="tools" aria-label="Góc nhìn và chế độ">
    <div class="seg" id="cams" role="group" aria-label="Góc camera">
      <button data-cam="cam1" class="on">Góc 1<small>từ bàn thờ</small></button>
      <button data-cam="cam2">Góc 2<small>sau tượng</small></button>
      <button data-cam="cam3">Góc 3<small>từ cửa</small></button>
    </div>
    <div class="seg" id="tod" role="group" aria-label="Ngày hay đêm">
      <button data-tod="day" class="on">Ngày</button><button data-tod="night">Đêm</button>
    </div>
    <div class="seg" id="mood" role="group" aria-label="Phong cách">
      <button data-mood="serious" class="on">Nghiêm túc</button><button data-mood="funny">Vui</button>
    </div>
    <button id="sound" class="plain" aria-pressed="false">Âm thanh: tắt</button>
  </nav>
</header>

<main class="wrap">
  <div class="stage" id="stage">
    <img class="scene" id="scene" alt="Chánh điện" draggable="false">
    <div class="layer" id="deco"></div>
    <div class="layer" id="seats"></div>
    <div class="layer" id="people"></div>
    <div class="layer" id="doors"></div>
    <div class="layer" id="fx"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
</main>

<footer class="bottom">
  <section id="join" class="panel">
    <p class="lead">Chọn nhân vật của bạn, rồi bấm một chỗ trống để vào phòng.</p>
    <div class="types" id="types" role="radiogroup" aria-label="Nhân vật"></div>
    <div class="row">
      <input id="name" maxlength="24" placeholder="Tên của bạn (ví dụ: Diệu Hoa)" aria-label="Tên">
      <button id="enter" class="main">Vào phòng</button>
    </div>
  </section>
  <section id="actions" class="panel hidden">
    <div class="row">
      <button data-act="pray">🙏 Chắp tay</button>
      <button data-act="lay">Lạy</button>
      <button data-act="mo">Gõ mõ</button>
      <button data-act="incense">Dâng hương</button>
      <button id="leave" class="plain">Rời phòng</button>
    </div>
    <p class="stats">Trong phòng: <b id="n-people">0</b> người · <b id="n-mo">0</b> tiếng mõ · <b id="n-lay">0</b> lần lạy</p>
  </section>
  <section class="panel demo">
    <div class="row">
      <span class="lead">Bản thử (chưa có máy chủ), người khác là người giả lập:</span>
      <button id="add-bot" class="plain">+ Thêm 1 người</button>
      <button id="fill" class="plain">Đầy phòng (20)</button>
      <label class="chk"><input type="checkbox" id="auto" checked> Tự động hành động</label>
    </div>
  </section>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
